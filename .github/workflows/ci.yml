name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --verbose

      - name: test
        run: cargo test --release --verbose

      - name: smoke — --help exits 0
        run: ./target/release/goose --help

      - name: smoke — --version exits 0
        run: ./target/release/goose --version

      - name: smoke — --list exits 0
        run: ./target/release/goose --list

      - name: smoke — --all renders a known target
        shell: bash
        run: |
          out=$(./target/release/goose --all --no-color git)
          echo "$out"
          echo "$out" | grep -q "git --version"

      - name: smoke — --os override works
        shell: bash
        run: |
          out=$(./target/release/goose --all --no-color --os ubuntu docker)
          echo "$out" | grep -q "apt"

      - name: smoke — unknown option exits 2
        shell: bash
        run: |
          set +e
          ./target/release/goose --frobnicate
          code=$?
          set -e
          test "$code" -eq 2

      - name: smoke — interactive (unix)
        if: runner.os != 'Windows'
        run: printf "git\n" | ./target/release/goose

      - name: smoke — interactive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "git`n" | ./target/release/goose.exe
